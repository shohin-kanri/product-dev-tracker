<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>商品開発プロジェクト進捗管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230086CC'/%3E%3Cpath d='M8 22V13.5L16 8l8 5.5V22h-5v-6h-6v6H8z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --brand-50:#e6f4fb;--brand-100:#cce9f7;--brand-400:#33a7df;--brand-500:#0086cc;--brand-600:#006ba3;--brand-700:#00507a;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;
  --emerald-50:#ecfdf5;--emerald-100:#d1fae5;--emerald-500:#10b981;--emerald-600:#059669;--emerald-700:#047857;--emerald-800:#065f46;
  --amber-50:#fffbeb;--amber-100:#fef3c7;--amber-500:#f59e0b;--amber-700:#b45309;--amber-800:#92400e;
  --red-50:#fef2f2;--red-100:#fee2e2;--red-500:#ef4444;--red-600:#dc2626;--red-700:#b91c1c;
  --violet-50:#f5f3ff;--violet-500:#8b5cf6;--violet-700:#6d28d9;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--slate-50);color:var(--slate-800);font-size:14px;}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px;border-bottom:1px solid var(--slate-200);}
.mobile-topbar{display:none;}
.mobile-close-btn{display:none;}
.mobile-nav-backdrop{display:none;}
.sidebar-logo{width:36px;height:36px;border-radius:8px;background:var(--brand-500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.sidebar-title{font-size:14px;font-weight:600;color:var(--slate-800);margin:0;}
.sidebar-subtitle{font-size:11px;color:var(--slate-400);margin:2px 0 0;}
.sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:none;background:none;text-align:left;font-size:14px;font-weight:500;color:var(--slate-600);cursor:pointer;width:100%;}
.nav-item:hover{background:var(--slate-50);}
.nav-item.active{background:var(--brand-50);color:var(--brand-700);}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.workstream-tabs{border-bottom:1px solid var(--slate-200);padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
.workstream-tabs-label{padding:0 8px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;color:var(--slate-400);}
.workstream-tab{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:600;text-align:left;color:var(--slate-500);cursor:pointer;}
.workstream-tab:hover{background:var(--slate-50);}
.workstream-tab .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.main-content{flex:1;overflow-y:auto;}
.page-container{max-width:1280px;margin:0 auto;padding:32px 24px;}
.page-header{margin-bottom:24px;}
.page-header h1{font-size:20px;font-weight:700;color:var(--slate-800);}
.page-desc{margin-top:4px;font-size:13px;color:var(--slate-500);}
.page-header-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;}
.page-header-title-row{display:flex;align-items:center;gap:14px;}
.icon-badge{border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-badge svg{width:20px;height:20px;}

.card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
.card-title{font-size:14px;font-weight:600;color:var(--slate-700);}
.card-subtitle{margin-top:2px;font-size:12px;color:var(--slate-400);}
.card-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:16px;}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:900px){.grid-3{grid-template-columns:1fr;}.overview-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2{grid-template-columns:1fr;}.overview-grid{grid-template-columns:1fr;}}

.section-gap{margin-top:24px;}
.ws-card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;display:inline-block;}
.stat-big{font-size:26px;font-weight:700;color:var(--slate-800);margin-bottom:8px;}
.stat-sub{margin-top:8px;font-size:12px;color:var(--slate-400);}
.progress-track{height:8px;background:var(--slate-100);border-radius:999px;overflow:hidden;}
.stat-box-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.progress-fill{height:100%;border-radius:999px;}

.stat-box{background:var(--slate-50);border-radius:8px;padding:14px;}
.stat-box-label{font-size:12px;font-weight:500;color:var(--slate-500);}
.stat-box-value{margin-top:8px;font-size:22px;font-weight:700;color:var(--slate-800);}
.stat-box-value .unit{margin-left:4px;font-size:12px;font-weight:400;color:var(--slate-400);}
.stat-big .unit{margin-left:2px;font-size:14px;font-weight:400;color:var(--slate-400);}
.overview-tile{padding:16px 20px;}
.stat-box-sub{margin-top:4px;font-size:11px;color:var(--slate-400);}
.axis-tab-box{border:2px solid transparent;text-align:left;cursor:pointer;width:100%;}
.axis-tab-box:hover{background:var(--slate-100);}
.axis-tab-box.active{border-color:var(--brand-500);background:var(--brand-50);}
.axis-tab-box.active .stat-box-label{color:var(--brand-700);}

.drilldown-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:0;margin-top:12px;border:1px solid var(--slate-200);border-radius:10px;overflow:hidden;}
@media (max-width:900px){.drilldown-grid{grid-template-columns:1fr;}}
.drilldown-col{border-right:1px solid var(--slate-200);padding:12px;min-height:200px;max-height:480px;overflow-y:auto;}
.drilldown-col:last-child{border-right:none;}
.drilldown-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.drilldown-col-title{font-size:12px;font-weight:600;color:var(--slate-500);text-transform:uppercase;letter-spacing:0.02em;margin-bottom:8px;}
.drilldown-col-header .drilldown-col-title{margin-bottom:0;}
.drilldown-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.drilldown-item{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px;border:none;border-radius:8px;background:var(--slate-50);text-align:left;cursor:pointer;}
.drilldown-item:hover{background:var(--slate-100);}
.drilldown-item.active{background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--brand-500);}
.drilldown-item-name{font-size:13px;font-weight:600;color:var(--slate-800);}
.drilldown-item-tags{display:flex;flex-wrap:wrap;gap:4px;}
.drilldown-col-detail{background:var(--slate-50);}
.spec-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--slate-200);padding-bottom:8px;}
.spec-tab{padding:6px 10px;border:none;background:none;border-radius:6px;font-size:12px;font-weight:600;color:var(--slate-500);cursor:pointer;}
.spec-tab:hover{background:var(--slate-100);}
.spec-tab.active{background:var(--brand-500);color:#fff;}
.spec-detail{background:#fff;border:1px solid var(--slate-200);border-radius:8px;padding:14px;}
.spec-detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.spec-detail-header h3{font-size:14px;font-weight:700;color:var(--slate-800);}
.spec-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px;}
.spec-detail-grid dt{font-size:11px;color:var(--slate-400);margin-bottom:2px;}
.spec-detail-grid dd{margin:0;font-size:13px;color:var(--slate-800);font-weight:500;}
.spec-detail-note{font-size:13px;color:var(--slate-700);white-space:pre-wrap;}
.spec-detail-actions{display:flex;gap:8px;margin-top:12px;}
.variant-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.variant-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--slate-200);background:#fff;border-radius:999px;font-size:12px;font-weight:600;color:var(--slate-600);cursor:pointer;}
.variant-chip:hover{background:var(--slate-100);}
.variant-chip.active{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-700);}
.variant-chip-tag{padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600;}
.cost-item-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.genre-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--slate-100);}
.genre-row-name{flex:1;font-size:13px;color:var(--slate-800);}
.genre-row .icon-btn:disabled{opacity:0.3;cursor:default;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--slate-200);background:#fff;font-size:12px;font-weight:600;color:var(--slate-600);cursor:pointer;}
.chip:hover{background:var(--slate-50);}
.chip.active{background:var(--brand-500);color:#fff;border-color:var(--brand-500);}
.oku25-log-card{border:1px solid var(--slate-200);border-radius:8px;padding:12px;margin-bottom:10px;}
.oku25-log-header{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--slate-500);margin-bottom:8px;}
.oku25-log-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.oku25-log-grid dt{font-size:11px;color:var(--slate-400);margin-bottom:2px;}
.oku25-log-grid dd{margin:0;font-size:13px;color:var(--slate-800);}
.oku25-item-row td{border-top:1px solid var(--slate-200);}
.oku25-item-toggle svg{width:16px;height:16px;transition:transform 0.15s ease;}
.oku25-item-toggle.collapsed svg{transform:rotate(-90deg);}
.oku25-detail-panel{background:var(--slate-50);padding:14px 16px 14px 52px;}
.cost-item-row .ci-label{flex:2;}
.cost-item-row .ci-unit-price{flex:1;}
.cost-item-row .ci-qty{flex:1;}
.gp-cost-table th, .gp-cost-table td{text-align:left;}
.gp-cost-table th:not(:first-child), .gp-cost-table td:not(:first-child){text-align:right;}
.gp-cost-total-row td{font-weight:700;border-top:1px solid var(--slate-200);}
.gp-edit-btn{margin-top:4px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:999px;flex-shrink:0;display:inline-block;}
.muted-text{font-size:11px;color:var(--slate-400);}

.empty-note{padding:24px 0;text-align:center;font-size:13px;color:var(--slate-400);}

.deadline-list{list-style:none;margin:0;padding:0;}
.deadline-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--slate-100);}
.related-doc-list{list-style:none;margin:0;padding:0;}
.related-doc-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--slate-100);}
.related-doc-icon{color:var(--slate-400);flex-shrink:0;display:flex;}
.related-doc-icon svg{width:20px;height:20px;}
.related-doc-body{flex:1;min-width:0;}
.related-doc-title{color:var(--brand-700, #0086CC);font-weight:500;text-decoration:none;word-break:break-all;}
.related-doc-title:hover{text-decoration:underline;}
.related-doc-item:first-child{border-top:none;}
.survey-map-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:16px;align-items:start;}
@media (max-width:900px){.survey-map-grid{grid-template-columns:1fr;}}
.jp-map-wrap{width:100%;background:var(--slate-50);border:1px solid var(--slate-200);border-radius:12px;padding:8px;}
.jp-map{width:100%;height:auto;display:block;max-height:420px;}
.jp-pref{transition:opacity 0.12s ease;}
.jp-pref:hover{opacity:0.72;}
.survey-legend{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:10px;font-size:12px;}
.survey-swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:6px;flex-shrink:0;}
.survey-legend .survey-swatch{margin-right:0;}
.survey-item-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;max-height:320px;overflow-y:auto;padding:4px;border:1px solid var(--slate-200);border-radius:10px;}
.survey-item{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--slate-200);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--slate-600);cursor:pointer;text-align:left;}
.survey-item:hover{border-color:var(--brand-400);background:var(--brand-50);}
.survey-item.active{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-700);font-weight:600;}
.survey-item-alias{color:var(--slate-400);font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.survey-has-data{background:var(--brand-50);color:var(--brand-700);border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600;flex-shrink:0;}
.survey-search-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
.survey-search-row .field{flex:1 1 240px;max-width:360px;}
.survey-pref-row{cursor:pointer;}
.survey-pref-row:hover td{background:var(--brand-50);}
.ai-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px dashed var(--slate-300);border-radius:10px;background:var(--slate-50);}
.ai-badge{background:var(--amber-50);color:var(--amber-800);border-radius:4px;font-size:10px;padding:1px 5px;font-weight:600;}
.dev-badge{background:var(--slate-100);color:var(--slate-600);border:1px solid var(--slate-300);border-radius:4px;font-size:10px;padding:2px 6px;font-weight:600;flex-shrink:0;}
.ai-bar .btn:disabled{opacity:0.5;cursor:not-allowed;}
.ai-spinner{width:14px;height:14px;border:2px solid var(--slate-300);border-top-color:var(--brand-500);border-radius:50%;display:inline-block;animation:ai-spin 0.7s linear infinite;flex-shrink:0;}
@keyframes ai-spin{to{transform:rotate(360deg);}}
.deadline-item:first-child{border-top:none;}
.deadline-title{font-size:13px;font-weight:500;color:var(--slate-700);}
.deadline-tags{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
.deadline-date{flex-shrink:0;font-size:13px;font-weight:600;color:var(--slate-600);white-space:nowrap;}
.deadline-date.overdue{color:var(--red-600);}
.overdue-note{font-size:11px;font-weight:400;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;}
.btn svg, .link-btn svg{width:16px;height:16px;flex-shrink:0;}
.btn-primary{background:var(--brand-500);color:#fff;}
.btn-primary:hover{background:var(--brand-600);}
.btn-secondary{background:#fff;border-color:var(--slate-300);color:var(--slate-600);}
.btn-secondary:hover{background:var(--slate-50);}
.btn-danger{background:#fff;border-color:var(--red-100);color:var(--red-600);}
.btn-danger:hover{background:var(--red-50);}
.icon-btn{border:none;background:none;color:var(--slate-400);cursor:pointer;padding:6px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--slate-100);color:var(--slate-600);}
.icon-btn svg{width:16px;height:16px;flex-shrink:0;}

.toggle-group{display:flex;border:1px solid var(--slate-300);border-radius:8px;padding:2px;background:#fff;}
.toggle-btn{border:none;background:none;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--slate-500);cursor:pointer;}
.toggle-btn.active{background:var(--brand-500);color:#fff;}

.filter-bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:16px;margin-bottom:20px;}
.filter-field{width:170px;}
.filter-label{display:block;font-size:11px;font-weight:500;color:var(--slate-600);margin-bottom:4px;}
.link-btn{background:none;border:none;color:var(--brand-600);font-size:12px;font-weight:500;cursor:pointer;padding-bottom:8px;}
.link-btn:hover{text-decoration:underline;}

.label{display:block;font-size:12px;font-weight:500;color:var(--slate-600);margin-bottom:4px;}
.input,select.input,textarea.input{width:100%;padding:8px 12px;border:1px solid var(--slate-300);border-radius:8px;font-size:13px;font-family:inherit;color:var(--slate-700);background:#fff;}
.input:focus{outline:2px solid var(--brand-100);border-color:var(--brand-500);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:14px;}
.field{margin-bottom:14px;}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 25px rgba(0,0,0,0.2);}
.modal.modal-wide{max-width:680px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-header h2{font-size:16px;font-weight:600;color:var(--slate-800);}
.modal-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;}
.modal-footer-right{display:flex;gap:8px;}

.kanban-board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:1100px){.kanban-board{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.kanban-board{grid-template-columns:1fr;}}
.pipeline-board-wrap{overflow-x:auto;padding-bottom:4px;}
.pipeline-board{display:flex;gap:12px;}
.pipeline-column{flex:0 0 224px;background:rgba(241,245,249,0.7);border-radius:12px;padding:10px;display:flex;flex-direction:column;}
.pipeline-column-header{display:flex;align-items:center;gap:6px;border-radius:8px;padding:9px 10px;margin-bottom:10px;}
.pipeline-column-title{flex:1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pipeline-column-count{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;flex-shrink:0;}
.pipeline-column-body{max-height:440px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.pipeline-card{background:#fff;border:1px solid var(--slate-200);border-radius:8px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.03);}
.pipeline-card:hover{border-color:var(--slate-300);box-shadow:0 2px 6px rgba(0,0,0,0.06);}
.pipeline-card-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.pipeline-card-name{font-size:14px;font-weight:700;color:var(--slate-800);}
.pipeline-card-meta{margin-top:5px;font-size:11px;color:var(--slate-400);}
.pipeline-card-footer{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.pipeline-card-assignee{font-size:11px;color:var(--slate-500);font-weight:500;}
.pipeline-card-channel{font-size:10px;font-weight:600;border-radius:999px;padding:2px 8px;}
.kanban-column{background:rgba(241,245,249,0.7);border-radius:12px;padding:12px;min-height:160px;}
.kanban-column-header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:10px;}
.kanban-column-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--slate-700);}

<script>
'use strict';

/* ============================== ユーティリティ ============================== */
function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function createId(prefix){
  var rand = (Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).slice(0,8);
  return prefix + '-' + rand;
}
var WEEKDAY_JA = ['日','月','火','水','木','金','土'];
function parseLocalDate(iso){
  var parts = iso.split('-').map(Number);
  return new Date(parts[0], (parts[1]||1)-1, parts[2]||1);
}
function startOfToday(){
  var d = new Date(); d.setHours(0,0,0,0); return d;
}
function formatDateJP(iso){
  if (!iso) return '未設定';
  var d = parseLocalDate(iso);
  return (d.getMonth()+1) + '/' + d.getDate() + '(' + WEEKDAY_JA[d.getDay()] + ')';
}
function formatDateLongJP(iso){
  if (!iso) return '未設定';
  var d = parseLocalDate(iso);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日(' + WEEKDAY_JA[d.getDay()] + ')';
}
function daysUntil(iso){
  if (!iso) return null;
  var d = parseLocalDate(iso); d.setHours(0,0,0,0);
  return Math.round((d.getTime() - startOfToday().getTime()) / 86400000);
}
function isOverdue(iso){
  var diff = daysUntil(iso);
  return diff !== null && diff < 0;
}
function formatYen(n){
  if (n===null || n===undefined || isNaN(n)) return '<span class="muted-text">未設定</span>';
  return '¥' + Math.round(n).toLocaleString();
}
function formatPercent1(n){
  if (n===null || n===undefined || isNaN(n)) return '<span class="muted-text">未設定</span>';
  return (n*100).toFixed(1) + '%';
}
function toNumberOrUndefined(raw){
  if (raw === undefined || raw === null || raw === '') return undefined;
  if (typeof raw === 'number') return isNaN(raw) ? undefined : raw;
  var match = String(raw).replace(/,/g, '').match(/[\d.]+/);
  return match ? Number(match[0]) : undefined;
}
function formatManYen(n){
  var num = toNumberOrUndefined(n);
  if (num === undefined) return '<span class="muted-text">未設定</span>';
  return Math.round(num).toLocaleString() + '万円';
}
/* ============================== 粗利表 計算ロジック(参照: 粗利表.xlsx) ============================== */
function calcGrossProfitTable(gp){
  var sellPrice = Number(gp.sellPrice) || 0;
  var orderQty = Number(gp.orderQty) || 0;
  var listPrice = (gp.listPrice !== undefined && gp.listPrice !== '' && gp.listPrice !== null) ? Number(gp.listPrice) : null;
  var couponUnitPrice = Number(gp.couponUnitPrice) || 0;
  var couponQty = Number(gp.couponQty) || 0;
  var feeRatePercent = Number(gp.feeRate) || 0;
  var costItems = gp.costItems || [];
  var discountAmount = listPrice !== null ? listPrice - sellPrice : null;
  var discountRate = (listPrice !== null && listPrice !== 0) ? (1 - sellPrice / listPrice) : null;
  var grossRevenue = sellPrice * orderQty;
  var revenue = grossRevenue - (couponUnitPrice * couponQty);
  var itemsTotal = costItems.reduce(function(sum, item){
    return sum + ((Number(item.unitPrice) || 0) * (Number(item.qty) || 0));
  }, 0);
  var feeAmount = revenue * (feeRatePercent / 100);
  /* 参照元(粗利表.xlsx)は「商品原価」(H25)を SUM(H9:H24) で計算しており、
     手数料(H24)は原価内訳の最終行として合計に含まれる。この構成をそのまま踏襲する。 */
  var costTotal = itemsTotal + feeAmount;
  var grossProfit = revenue - costTotal;
  var grossProfitRate = revenue !== 0 ? grossProfit / revenue : null;
  return {
    discountAmount:discountAmount, discountRate:discountRate, revenue:revenue,
    itemsTotal:itemsTotal, feeAmount:feeAmount, costTotal:costTotal,
    grossProfit:grossProfit, grossProfitRate:grossProfitRate
  };
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}

/* ============================== 参入推奨度ロジック(純粋関数) ============================== */
var MARKET_SIZE_SCORES = {'特大':2,'かなり大':1.5,'大':1,'中小':0};
var MARKET_SIZE_REASONS = {
  '特大':'市場規模が特大のため、成功時のインパクトが大きい市場です。',
  'かなり大':'市場規模がかなり大きく、インパクトが期待できる市場です。',
  '大':'市場規模は大きく、一定のインパクトが期待できます。',
  '中小':'市場規模は中小のため、成功してもインパクトは限定的です。'
};
var STRENGTH_GENRES = ['米・雑穀','フルーツ','野菜'];

function calcEntryEaseScore(topSharePercent, topCompanyCount, reasons){
  if (topSharePercent >= 15){
    reasons.push('トップシェア' + topSharePercent + '%は15%以上で独占感が強く、参入障壁が高い水準です。');
    return -2;
  }
  if (topSharePercent >= 10){
    reasons.push('トップシェア' + topSharePercent + '%はやや寡占気味で、勝率が下がりやすい水準です。');
    return -1;
  }
  if (topSharePercent >= 5){
    if (topCompanyCount !== undefined && topCompanyCount >= 5 && topCompanyCount <= 10){
      reasons.push('トップシェア' + topSharePercent + '%かつ上位' + topCompanyCount + '社に分散しており、狙い目のバランスです。');
      return 2;
    }
    reasons.push('トップシェア' + topSharePercent + '%は狙い目レンジ(5〜10%)ですが、上位社数の分散度合いが想定と異なります。');
    return 1;
  }
  reasons.push('トップシェア' + topSharePercent + '%は5%未満で乱立傾向があり、価格競争でコストパフォーマンスが悪化しやすい水準です。');
  return -2;
}
function calcMarketSizeScore(marketSizeCategory, reasons){
  reasons.push(MARKET_SIZE_REASONS[marketSizeCategory]);
  return MARKET_SIZE_SCORES[marketSizeCategory];
}
function calcStrengthFitScore(genre, reasons){
  if (STRENGTH_GENRES.indexOf(genre) !== -1){
    reasons.push('「' + genre + '」は自社「くまもと風土」の強み(米・柑橘・野菜)に合致するジャンルです。');
    return 1;
  }
  if (genre === '水産'){
    reasons.push('水産は中長期課題と位置づけられており、現時点では優先度を下げています。');
    return -1;
  }
  return 0;
}
function calcProcessingConstraintScore(hasProcessingConstraint, reasons){
  if (hasProcessingConstraint){
    reasons.push('東北・北海道等からの原料輸送が必要でロット確保・原価面の制約があります。');
    return -1;
  }
  return 0;
}
function scoreToRecommendation(totalScore){
  if (totalScore >= 4) return '◎';
  if (totalScore >= 2) return '○';
  if (totalScore >= 0) return '△';
  return '×';
}
function evaluateMarketEntry(input){
  if (input.topSharePercent === undefined || input.marketSizeCategory === undefined){
    return {
      recommendation:'データ不足', totalScore:null,
      breakdown:{entryEaseScore:null, marketSizeScore:null, strengthFitScore:0, processingConstraintScore:0},
      reasons:['市場規模区分とトップシェア%の両方が入力されると、参入推奨度を判定できます。']
    };
  }
  var reasons = [];
  var entryEaseScore = calcEntryEaseScore(input.topSharePercent, input.topCompanyCount, reasons);
  var marketSizeScore = calcMarketSizeScore(input.marketSizeCategory, reasons);
  var strengthFitScore = calcStrengthFitScore(input.genre, reasons);
  var processingConstraintScore = calcProcessingConstraintScore(input.hasProcessingConstraint, reasons);
  var totalScore = entryEaseScore + marketSizeScore + strengthFitScore + processingConstraintScore;
  return {
    recommendation: scoreToRecommendation(totalScore),
    totalScore: totalScore,
    breakdown:{entryEaseScore:entryEaseScore, marketSizeScore:marketSizeScore, strengthFitScore:strengthFitScore, processingConstraintScore:processingConstraintScore},
    reasons: reasons
  };
}

function spSaveRemote(){
  return fetch(SP_SAVE_URL, {method:'POST', headers:{'Content-Type':'application/json'},

function findRemoteRecord(items){
  var match = items.filter(function(r){ return r.TaskId === SP_TASK_ID; })[0];
  return match ? JSON.parse(match.DataJson) : null;
}
function applyRemoteData(remoteData){
  appData.members = remoteData.members || [];
  appData.tasks = remoteData.tasks || [];
  appData.productCategories = remoteData.productCategories || [];
  appData.meetings = remoteData.meetings || [];
  appData.genres = remoteData.genres || PRODUCT_GENRE_ORDER.slice();
  appData.goals = remoteData.goals || [];
  appData.oku25Items = remoteData.oku25Items || [];
  appData.oku25Genres = remoteData.oku25Genres || PRODUCT_GENRE_ORDER.slice();
  appData.oku25GenreTargets = remoteData.oku25GenreTargets || {};
  appData.relatedDocs = remoteData.relatedDocs || {};
  appData.aiSearchFlowUrl = remoteData.aiSearchFlowUrl || "";
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPayload())); }catch(e){}
}
function initSharePointSync(){
  setSyncStatus('syncing');
  spFetchAll().then(function(items){
    var remoteData = findRemoteRecord(items);
    if (remoteData){
      applyRemoteData(remoteData);
      return null;
    }
    return spSaveRemote();
  }).then(function(){
    spEnabled = true;
    setSyncStatus('online');
    render();
    if (!spPollTimer) spPollTimer = setInterval(pollSharePoint, SP_POLL_INTERVAL_MS);
  }).catch(function(e){
    spEnabled = false;
    setSyncStatus('offline');
    console.warn('SharePoint同期が利用できません。ローカル保存のみで動作します。', e);
  });
}
function pollSharePoint(){
  if (!spEnabled) return;
  spFetchAll().then(function(items){
    var remoteData = findRemoteRecord(items);
    if (!remoteData) return;
    var remoteStr = JSON.stringify(remoteData);
    var localStr = JSON.stringify(currentPayload());
    if (remoteStr !== localStr){
      applyRemoteData(remoteData);
      render();
    }
    setSyncStatus('online');
  }).catch(function(){ setSyncStatus('error'); });
}
function downloadDataAsJson(){
  var now = new Date();
  var stamp = [now.getFullYear(), now.getMonth()+1, now.getDate()].map(function(n){return String(n).padStart(2,'0');}).join('');
  var payload = {members:appData.members, tasks:appData.tasks, productCategories:appData.productCategories, meetings:appData.meetings, genres:appData.genres, goals:appData.goals, oku25Items:appData.oku25Items, oku25Genres:appData.oku25Genres, oku25GenreTargets:appData.oku25GenreTargets, relatedDocs:appData.relatedDocs, aiSearchFlowUrl:appData.aiSearchFlowUrl};
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = 'product-dev-tracker-' + stamp + '.json';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
function isValidAppData(v){
  return v && typeof v === 'object' && Array.isArray(v.members) && Array.isArray(v.tasks) && Array.isArray(v.productCategories) && Array.isArray(v.meetings);
}
function readDataFromJsonFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(String(reader.result));
        if (!isValidAppData(parsed)){
          reject(new Error('ファイルの形式が正しくありません(members/tasks/productCategories/meetingsが必要です)'));
          return;
        }
        resolve(parsed);
      }catch(e){
        reject(new Error('JSONの解析に失敗しました。ファイル内容を確認してください'));
      }
    };
    reader.onerror = function(){ reject(new Error('ファイルの読み込みに失敗しました')); };
    reader.readAsText(file);
  });
}

/* IME(日本語入力)対策
   検索欄は入力のたびに render() で画面全体を作り直すため、変換確定前に再描画すると
   入力欄そのものが差し替わって変換セッションが壊れる(「トマト」が「tおmあtお」になる)。
   composition 中は再描画を抑止し、確定時(compositionend)にまとめて反映する。
   なお composition 系イベントには on* のインライン属性が存在しないため(HTML標準外)、
   document への委譲で拾う。対象は data-ime-search 属性にハンドラ名を持つ入力欄。 */
var imeComposing = false;
function onSearchInput(el, fnName){
  if (imeComposing) return;
  window[fnName](el.value);
}
document.addEventListener('compositionstart', function(e){
  var el = e.target;
  if (el && el.dataset && el.dataset.imeSearch) imeComposing = true;
});
document.addEventListener('compositionend', function(e){
  var el = e.target;
  if (!el || !el.dataset || !el.dataset.imeSearch) return;
  imeComposing = false;
  var fn = window[el.dataset.imeSearch];
  if (typeof fn === 'function') fn(el.value);
});

function addTask(input, fromNextAction){
  var now = new Date().toISOString();
  var task = Object.assign({}, input, {id:createId('task'), createdAt:now, updatedAt:now});
  appData.tasks.push(task);
  if (fromNextAction){
    var meeting = appData.meetings.filter(function(m){return m.id===fromNextAction.meetingId;})[0];
    if (meeting){
      var na = meeting.nextActions.filter(function(n){return n.id===fromNextAction.nextActionId;})[0];
      if (na){ na.linkedTaskId = task.id; na.done = true; }
    }
  }
  saveData();
}
function updateTask(id, patch){
  var task = appData.tasks.filter(function(t){return t.id===id;})[0];
  if (!task) return;
  Object.assign(task, patch, {updatedAt:new Date().toISOString()});
  saveData();
}

function renderIconBadge(icon, colorKey, size){
  size = size || 40;
  var bg = colorKey+'50', text = colorKey+'700';
  return '<div class="icon-badge" style="width:'+size+'px;height:'+size+'px;background:'+COLORS[bg]+';color:'+COLORS[text]+';">'+icon+'</div>';
}
function renderPageHeaderTitle(icon, colorKey, title, desc){
  return '<div class="page-header-title-row">'+renderIconBadge(icon, colorKey)+
    '<div><h1>'+title+'</h1>'+(desc?'<p class="page-desc">'+desc+'</p>':'')+'</div>' +

/* ============================== ページ全体レンダリング ============================== */
function render(){
  var root = document.getElementById('app');
  root.innerHTML = '<div class="app-shell">' +
      '<div class="mobile-topbar"><button type="button" class="icon-btn mobile-menu-btn" data-action="toggle-mobile-nav">'+ICONS.menu+'</button><p class="mobile-topbar-title">商品管理部 MDプロジェクト</p></div>' +
      '<div class="mobile-nav-backdrop'+(ui.mobileNavOpen?' show':'')+'" data-action="close-mobile-nav"></div>' +
      renderSidebar() +
      '<main class="main-content"><div class="page-container">' + renderPage() + '</div></main>' +
    '</div>' + renderModals() +
    '<p id="sync-status" class="sync-status-badge"></p>';
  if (ui.categoryModal) onCategoryFieldChange();
  if (ui.grossProfitModal) onGrossProfitFieldChange();
}
function renderSidebar(){
  var items = [
    {id:'dashboard', label:'ダッシュボード', icon:ICONS.dashboard},
    {id:'tasks', label:'タスク管理', icon:ICONS.tasks},
    {id:'categories', label:'商品カテゴリー評価', icon:ICONS.categories},
    {id:'meetings', label:'会議・議事録', icon:ICONS.meetings},
    {id:'goals', label:'目標・KPI', icon:ICONS.goals},
    {id:'members', label:'担当者管理', icon:ICONS.members},
    {id:'settings', label:'データ管理', icon:ICONS.settings}
  ];
  if (ui.activeWorkstream === 'project-25oku'){
    items = items.filter(function(item){ return item.id !== 'tasks' && item.id !== 'categories'; });
  } else if (ui.activeWorkstream === 'nationwide-survey'){
    items = items.filter(function(item){
      return item.id !== 'categories' && item.id !== 'meetings' && item.id !== 'goals' && item.id !== 'members';
    });
  }
  var navHtml = items.map(function(item){
    return '<button type="button" class="nav-item ' + (ui.page===item.id?'active':'') + '" data-action="nav" data-page="'+item.id+'">'+item.icon+'<span>'+item.label+'</span></button>';
  }).join('');
  return '<aside class="sidebar'+(ui.mobileNavOpen?' mobile-open':'')+'">' +
    '<div class="sidebar-header"><p class="sidebar-title">商品管理部<br>MDプロジェクト</p><button type="button" class="icon-btn mobile-close-btn" data-action="close-mobile-nav">'+ICONS.close+'</button></div>' +
    renderWorkstreamTabs() +
    '<nav class="sidebar-nav">' + navHtml + '</nav>' +
  '</aside>';
}
function renderWorkstreamTabs(){
  var tabsHtml = WORKSTREAM_ORDER.map(function(ws){
    var isActive = ws === ui.activeWorkstream;
    var color = WORKSTREAM_COLORS[ws];
    return '<button type="button" class="workstream-tab' + (isActive ? ' active' : '') + '" data-action="select-workstream" data-workstream="' + ws + '" style="' + (isActive ? 'background:' + color.bg + ';color:' + color.text + ';' : '') + '">' +
      '<span class="dot" style="background:' + color.dot + '"></span>' +
      '<span class="truncate">' + WORKSTREAM_LABELS[ws] + '</span>' +
    '</button>';
  }).join('');
  return '<div class="workstream-tabs"><p class="workstream-tabs-label">プロジェクト</p>' + tabsHtml + '</div>';
}
function renderPage(){
  if (ui.page === 'tasks') return renderTasksPage();
  if (ui.page === 'categories') return renderCategoriesPage();
  if (ui.page === 'meetings') return renderMeetingsPage();
  if (ui.page === 'goals') return renderGoalsPage();
  if (ui.page === 'members') return renderMembersPage();
  if (ui.page === 'settings') return renderSettingsPage();
  return renderDashboard();
}
function renderModals(){
  var html = '';
  if (ui.taskModal) html += renderTaskModal();
  if (ui.categoryModal) html += renderCategoryModal();
  if (ui.memberModal) html += renderMemberModal();
  if (ui.grossProfitModal) html += renderGrossProfitModal();
  if (ui.competitorModal) html += renderCompetitorModal();
  if (ui.genreModal) html += renderGenreModal();
  if (ui.goalModal) html += renderGoalModal();
  if (ui.oku25ItemModal) html += renderOku25ItemModal();
  if (ui.oku25GenreModal) html += renderOku25GenreModal();
  if (ui.oku25LogModal) html += renderOku25LogModal();
  if (ui.relatedDocModal) html += renderRelatedDocModal();
  if (ui.meetingModal) html += renderMeetingModal();
  if (ui.variantModal) html += renderVariantModal();
  return html;
}

/* ============================== ダッシュボード ============================== */
function renderDashboard(){
  var activeWs = ui.activeWorkstream;
  var scopedTasks = appData.tasks.filter(function(t){return t.workstream===activeWs;});

  var color = WORKSTREAM_COLORS[activeWs];
  var done = scopedTasks.filter(function(t){return t.status==='done';}).length;
  var total = scopedTasks.length;
  var pct = total===0 ? 0 : Math.round(done/total*100);
  var progressCard;
  if (activeWs === 'product-dev'){
    progressCard = renderProductOverviewStats();
  } else if (activeWs === 'project-25oku'){
    progressCard = renderOku25GenreOverview();
  } else if (activeWs === 'nationwide-survey'){
    progressCard = '';
  } else {
    var wsColorKey = 'emerald';
    var wsIcon = ICONS.categories;
    progressCard = '<div class="card">' +
        '<div class="ws-card-header">'+renderIconBadge(wsIcon, wsColorKey, 36)+'<p class="card-title" style="margin-left:4px;">'+WORKSTREAM_LABELS[activeWs]+'</p></div>' +
        '<p class="stat-big">'+pct+'%</p>' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+color.dot+'"></div></div>' +
        '<p class="stat-sub">'+done+' / '+total+' 件完了</p>' +
      '</div>';
  }

  var axisSection = '';
  var axisDrilldownSection = '';
  var pipelineSection = '';
  if (activeWs === 'product-dev'){
    var axisCards = PRODUCT_DEV_AXIS_ORDER.map(function(axis){
      var axisTasks = scopedTasks.filter(function(t){return t.productDevAxis===axis;});
      var axisDone = axisTasks.filter(function(t){return t.status==='done';}).length;
      var isActive = axis === ui.activeProductAxis;
      return '<button type="button" class="stat-box axis-tab-box'+(isActive?' active':'')+'" data-action="select-product-axis" data-axis="'+axis+'">' +
        '<p class="stat-box-label">'+PRODUCT_DEV_AXIS_LABELS[axis]+'</p>' +
        '<p class="stat-box-value">'+axisTasks.length+'<span class="unit">件</span></p>' +
        '<p class="stat-box-sub">完了 '+axisDone+'件</p>' +
      '</button>';
    }).join('');
    axisSection = '<div class="card section-gap"><p class="card-title">3軸別タスク数</p><p class="card-subtitle">タブを選択すると下に該当軸のダッシュボードが表示されます</p><div class="grid-3" style="margin-top:12px;">'+axisCards+'</div></div>';
    axisDrilldownSection = renderProductAxisDrilldown(ui.activeProductAxis);
    pipelineSection = renderReleasePipeline(ui.activeProductAxis);
  }

  var upcomingSection = '';
  if (activeWs === 'project-25oku'){
    upcomingSection = renderOku25Section();
  } else if (activeWs !== 'product-dev' && activeWs !== 'nationwide-survey'){
    var upcoming = scopedTasks.filter(function(t){return t.status!=='done' && t.dueDate;})
      .sort(function(a,b){return a.dueDate<b.dueDate?-1:a.dueDate>b.dueDate?1:0;})
      .slice(0,8);
    var upcomingHtml;
    if (upcoming.length===0){
      upcomingHtml = '<p class="empty-note">期限が設定された未完了タスクはありません。</p>';
    } else {
      upcomingHtml = '<ul class="deadline-list">' + upcoming.map(function(t){
        var overdue = isOverdue(t.dueDate);
        var diff = daysUntil(t.dueDate);
        return '<li class="deadline-item">' +
          '<div><p class="deadline-title">'+escapeHtml(t.title)+'</p>' +
          '<div class="deadline-tags">'+renderBadge(TASK_PRIORITY_LABELS[t.priority], TASK_PRIORITY_COLORS[t.priority])+'<span class="muted-text">'+escapeHtml(getMemberName(t.assigneeId))+'</span></div></div>' +
          '<div class="deadline-date '+(overdue?'overdue':'')+'">'+formatDateJP(t.dueDate)+(overdue?' <span class="overdue-note">('+Math.abs(diff)+'日超過)</span>':'')+'</div>' +
        '</li>';
      }).join('') + '</ul>';
    }
    upcomingSection = '<div class="card section-gap"><p class="card-title">期限が近いタスク</p><p class="card-subtitle">未完了タスクを期限が近い順に表示しています</p>'+upcomingHtml+'</div>';
  }

  var relatedDocsSection = '';
  if (activeWs === 'product-dev' || activeWs === 'project-25oku'){
    relatedDocsSection = renderRelatedDocsSection(activeWs);
  }

  var surveySection = '';
  if (activeWs === 'nationwide-survey'){
    surveySection = renderSurveyMapSection() + renderPrimaryProductsSection();
  }

  return '<div class="page-header">'+renderPageHeaderTitle(ICONS.dashboard, 'brand', WORKSTREAM_LABELS[activeWs]+' ダッシュボード', 'このプロジェクトの進捗状況を確認できます。')+'</div>' +
    relatedDocsSection +
    surveySection +
    progressCard +
    axisSection +
    axisDrilldownSection +
    pipelineSection +
    upcomingSection;
}
function renderRelatedDocsSection(workstream){
  var docs = getRelatedDocs(workstream);
  var listHtml = docs.length === 0 ? '<p class="empty-note">まだ資料が登録されていません。</p>' :
    '<ul class="related-doc-list">' + docs.map(function(d){
      return '<li class="related-doc-item">' +
        '<div class="related-doc-icon">'+ICONS.fileText+'</div>' +
        '<div class="related-doc-body">' +
          '<a href="'+escapeHtml(d.url)+'" target="_blank" rel="noopener noreferrer" class="related-doc-title">'+escapeHtml(d.title)+'</a>' +
        '</div>' +
        '<div style="display:flex;gap:4px;">' +
          '<button type="button" class="icon-btn" data-action="open-related-doc-edit" data-workstream="'+workstream+'" data-doc-id="'+d.id+'" title="編集">'+ICONS.edit+'</button>' +
          '<button type="button" class="icon-btn" data-action="delete-related-doc" data-workstream="'+workstream+'" data-doc-id="'+d.id+'" title="削除">'+ICONS.trash+'</button>' +
        '</div>' +
      '</li>';
    }).join('') + '</ul>';
  return '<div class="card section-gap" style="margin-bottom:24px;">' +
    '<div class="card-header-row"><div><p class="card-title">関連資料</p><p class="card-subtitle">PowerPointなど関連資料へのリンクを管理します</p></div>' +
      '<button type="button" class="btn btn-secondary" data-action="open-related-doc-create" data-workstream="'+workstream+'">'+ICONS.plus+'資料を追加</button>' +
    '</div>' +
    listHtml +
  '</div>';
}

  '杉':'すぎ','檜':'ひのき','桧':'ひのき','唐松':'からまつ','椎茸':'しいたけ','椎茸(乾)':'乾しいたけ',
  '榎茸':'えのきたけ','舞茸':'まいたけ','滑子':'なめこ','漆':'うるし','木炭':'木炭','炭':'木炭'
};
/* 生の(未正規化)クエリに漢字対応表の見出し語が部分一致で含まれていれば、
   対応するひらがな/カタカナ表記を検索候補として返す。 */
function kanjiSearchTargets(rawQuery){
  if (!rawQuery) return [];
  var out = [];
  Object.keys(KANJI_SEARCH_ALIASES).forEach(function(k){
    if (rawQuery.indexOf(k) !== -1) out.push(normalizeKana(KANJI_SEARCH_ALIASES[k]));
  });
  return out;
}
/* ---------- AIリアルタイム調査 ----------
   Power Automate のフロー経由でAIに問い合わせる。APIキーはフロー側に置くため
   このファイルには含めない。取得結果は「一時表示のみ」の方針に従い、
   SharePoint/localStorage には一切保存せず、下記のセッション内キャッシュにのみ保持する
   (リロードで消える)。AIは統計値を捏造しうるため、必ず出典付き・AIバッジ付きで表示する。 */
var AI_CACHE = {};
var VALID_PREF_NAMES = null;
function isValidPrefName(n){
  if (!VALID_PREF_NAMES){
    VALID_PREF_NAMES = {};
    JP_PREFS.forEach(function(p){ VALID_PREF_NAMES[p.n] = true; });
  }
  return !!VALID_PREF_NAMES[n];
}
function getProductionEntries(name){
  if (!name) return [];
  return (PRODUCTION_DATA[name] || []).concat(AI_CACHE[name] || []);
}
/* AI応答を検証して取り込む。不正な都道府県名や数値は落とし、
   1件も残らなかった品目は採用しない。取り込めた品目名の配列を返す。 */
function mergeAiResult(payload){
  var items = (payload && payload.items) || [];
  var accepted = [];
  items.forEach(function(it){
    if (!it || !it.name || !Array.isArray(it.ranking)) return;
    var ranking = it.ranking.filter(function(r){
      return r && isValidPrefName(r.pref) && typeof r.value === 'number' && isFinite(r.value) && r.value >= 0;
    }).slice(0, 10);
    if (!ranking.length) return;
    var entry = {
      label: String(it.label || it.name),
      year: it.year ? String(it.year) : '',
      source: it.source ? String(it.source) : 'AIによる収集',
      unit: it.unit ? String(it.unit) : '',
      url: it.url ? String(it.url) : '',
      ranking: ranking,
      ai: true
    };
    var key = String(it.name);
    AI_CACHE[key] = (AI_CACHE[key] || []).filter(function(e){ return e.label !== entry.label; });
    AI_CACHE[key].push(entry);
    accepted.push(key);
  });
  return accepted;
}
function runAiSearch(mode, query){
  var url = (appData.aiSearchFlowUrl || '').trim();
  if (!url){
    ui.aiError = 'AI調査フローのURLが未設定です。「データ管理」画面で設定してください。';
    ui.aiNotice = null;
    render(); return;
  }
  ui.aiLoading = true; ui.aiError = null; ui.aiNotice = null;
  render();
  fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({mode: mode, query: query})})
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(data){
      var accepted = mergeAiResult(data);
      ui.aiLoading = false;
      if (!accepted.length){
        ui.aiError = '「'+query+'」について有効なデータを取得できませんでした。';
      } else {
        ui.aiNotice = 'AIが'+accepted.length+'件の統計を取得しました（参考値・未保存）。';
        if (mode === 'product' && accepted.indexOf(query) !== -1){ ui.surveySelected = query; ui.surveyEntryIndex = 0; }
      }
      render();
    })
    .catch(function(e){
      ui.aiLoading = false;
      ui.aiError = 'AI調査に失敗しました（' + e.message + '）。フローのURLと公開設定をご確認ください。';
      render();
    });
}
function buildRankMap(entry){
  var m = {};
  if (!entry || !entry.ranking) return m;
  entry.ranking.forEach(function(r, i){ m[r.pref] = {rank:i+1, value:r.value}; });
  return m;
}
function renderJapanMap(rankMap, highlightPref){
  var normal = [], accent = [];
  JP_PREFS.forEach(function(p){
    var r = rankMap[p.n];
    var isHi = highlightPref && p.n === highlightPref;
    var fill = r ? (SURVEY_RANK_COLORS[r.rank-1] || SURVEY_RANK_COLORS[9]) : SURVEY_NO_DATA_FILL;
    if (isHi && !r) fill = COLORS.amber50;
    var label = r ? p.n+' 第'+r.rank+'位 '+r.value.toLocaleString() : p.n;
    var stroke = isHi ? COLORS.amber700 : '#ffffff';
    var sw = isHi ? 2.5 : 1;
    var html = '<path d="'+p.p+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" class="jp-pref"><title>'+escapeHtml(label)+'</title></path>';
    /* ハイライトは最後に描画して枠線が隣県に隠れないようにする */
    (isHi ? accent : normal).push(html);
  });
  return '<div class="jp-map-wrap"><svg viewBox="'+JP_MAP_VIEWBOX+'" class="jp-map" role="img" aria-label="都道府県別生産量マップ">'+normal.join('')+accent.join('')+'</svg></div>';
}
/* 指定した都道府県がトップ10入りしている統計を全件抽出する */
function getProductionByPref(pref){
  var seen = {}, out = [];
  var names = Object.keys(PRODUCTION_DATA);
  Object.keys(AI_CACHE).forEach(function(k){ if (names.indexOf(k) === -1) names.push(k); });
  names.forEach(function(prod){
    getProductionEntries(prod).forEach(function(en, idx){
      var pos = -1;
      for (var i = 0; i < en.ranking.length; i++){ if (en.ranking[i].pref === pref){ pos = i; break; } }
      if (pos === -1) return;
      /* 同一統計が複数品目に登録されているため値ベースで重複排除する */
      var key = (en.label||'')+'|'+(en.year||'')+'|'+(en.unit||'')+'|'+en.ranking[0].pref+'|'+en.ranking[0].value;
      if (seen[key]) return;
      seen[key] = true;
      out.push({label: en.label || prod, product: prod, entryIndex: idx, ai: !!en.ai,
                rank: pos+1, value: en.ranking[pos].value, unit: en.unit||'', year: en.year||''});
    });
  });
  out.sort(function(a,b){ return a.rank - b.rank || (a.label < b.label ? -1 : 1); });
  return out;
}
function resolveSurveyPref(){
  var q = normalizeKana((ui.surveyPrefSearch||'').trim());
  if (!q) return {matches: [], active: null};
  var matches = JP_PREFS.filter(function(p){
    return normalizeKana(p.n).indexOf(q) !== -1 || normalizeKana(p.s).indexOf(q) !== -1;
  });
  var picked = null;
  if (ui.surveyPref && matches.some(function(p){ return p.n === ui.surveyPref; })) picked = ui.surveyPref;
  else if (matches.length === 1) picked = matches[0].n;
  return {matches: matches, active: picked};
}

  var prefState = resolveSurveyPref();

        '<div class="pipeline-card-row"><span class="pipeline-card-name">'+escapeHtml(x.variant.name)+'</span></div>' +
        '<p class="pipeline-card-meta">'+escapeHtml(x.category.genre)+'('+escapeHtml(x.category.name)+')</p>' +
        '<div class="pipeline-card-footer">' +

        '</div>' +

/* ============================== 3軸別ダッシュボード(大分類→商品→規格詳細) ============================== */
function renderProductAxisDrilldown(activeAxis){
  var categoriesInAxis = appData.productCategories.filter(function(c){return c.productDevAxis===activeAxis;});

  var genres = appData.genres;
  var effectiveGenre = ui.drilldownGenre;
  if (!effectiveGenre || genres.indexOf(effectiveGenre) === -1){
    effectiveGenre = genres.length ? genres[0] : null;
  }

  var categoriesInGenre = effectiveGenre ? categoriesInAxis.filter(function(c){return c.genre===effectiveGenre;}) : [];

  var effectiveCategoryId = ui.drilldownCategoryId;
  if (!effectiveCategoryId || !categoriesInGenre.some(function(c){return c.id===effectiveCategoryId;})){
    effectiveCategoryId = categoriesInGenre.length ? categoriesInGenre[0].id : null;
  }
  var activeCategory = categoriesInGenre.filter(function(c){return c.id===effectiveCategoryId;})[0] || null;
  var variants = activeCategory && activeCategory.variants ? activeCategory.variants : [];

  var effectiveVariantId = ui.drilldownVariantId;
  if (!effectiveVariantId || !variants.some(function(v){return v.id===effectiveVariantId;})){
    effectiveVariantId = variants.length ? variants[0].id : null;
  }
  var activeVariant = variants.filter(function(v){return v.id===effectiveVariantId;})[0] || null;

  var col1Html = '<ul class="drilldown-list">' + genres.map(function(g){
    var isActive = g === effectiveGenre;
    var countInGenre = categoriesInAxis.filter(function(c){return c.genre===g;}).length;
    return '<li><button type="button" class="drilldown-item'+(isActive?' active':'')+'" data-action="select-drilldown-genre" data-genre="'+escapeHtml(g)+'">' +
      '<span class="drilldown-item-name">'+escapeHtml(g)+'</span>' +
      '<span class="drilldown-item-tags"><span class="muted-text">'+countInGenre+'件</span></span>' +
    '</button></li>';
  }).join('') + '</ul>';

  var col2Html;
  if (!effectiveGenre){
    col2Html = '<p class="empty-note">左のジャンルを選択してください。</p>';
  } else if (categoriesInGenre.length === 0){
    col2Html = '<p class="empty-note">このジャンルにはまだ商品が登録されていません。</p>';
  } else {
    col2Html = '<ul class="drilldown-list">' + categoriesInGenre.map(function(c){
      var ev = evaluateMarketEntry({genre:c.genre, marketSizeCategory:c.marketSizeCategory, topSharePercent:c.topSharePercent, topCompanyCount:c.topCompanyCount, hasProcessingConstraint:c.hasProcessingConstraint});
      var isActive = c.id === effectiveCategoryId;
      return '<li><button type="button" class="drilldown-item'+(isActive?' active':'')+'" data-action="select-drilldown-category" data-category-id="'+c.id+'" ondblclick="openCategoryEdit(\''+c.id+'\')">' +
        '<span class="drilldown-item-name">'+escapeHtml(c.name)+'</span>' +
        '<span class="drilldown-item-tags">'+renderBadge(ev.recommendation, RECOMMENDATION_COLORS[ev.recommendation])+renderBadge(c.status, CATEGORY_STATUS_COLORS[c.status])+'</span>' +
      '</button></li>';
    }).join('') + '</ul>';
  }
  var col2AddBtn = effectiveGenre ?
    '<button type="button" class="link-btn" style="padding-bottom:0;" data-action="open-category-create-preset" data-genre="'+escapeHtml(effectiveGenre)+'" data-axis="'+activeAxis+'">+ 商品(カテゴリー)を追加</button>' : '';

  var variantChipsHtml = '';
  if (activeCategory){
    if (variants.length === 0){
      variantChipsHtml = '<p class="empty-note" style="padding:8px 0;">まだ規格(商品バリエーション)が登録されていません。</p>';
    } else {
      variantChipsHtml = '<div class="variant-chip-row">' + variants.map(function(v){
        var isActive = v.id === effectiveVariantId;
        var channelColor = SALES_CHANNEL_COLORS[v.salesChannel] || {bg:COLORS.slate100,text:COLORS.slate600,dot:COLORS.slate400};
        return '<button type="button" class="variant-chip'+(isActive?' active':'')+'" data-action="select-drilldown-variant" data-variant-id="'+v.id+'">' +
          escapeHtml(v.name) + '<span class="variant-chip-tag" style="background:'+channelColor.bg+';color:'+channelColor.text+'">'+(SALES_CHANNEL_LABELS[v.salesChannel]||'未設定')+'</span>' +
        '</button>';
      }).join('') + '</div>';
    }
    variantChipsHtml += '<button type="button" class="link-btn" data-action="open-variant-create" data-category-id="'+activeCategory.id+'">+ 規格を追加</button>';
  }

  var tabsHtml = SPEC_TAB_ORDER.map(function(tab){
    var isActive = tab === ui.specTab;
    return '<button type="button" class="spec-tab'+(isActive?' active':'')+'" data-action="spec-tab" data-tab="'+tab+'">'+SPEC_TAB_LABELS[tab]+'</button>';
  }).join('');

  var col3Body;
  if (!activeCategory){
    col3Body = '<p class="empty-note">左で商品を選択してください。</p>';
  } else if (!activeVariant){
    col3Body = '<p class="empty-note">上の規格を選択してください。</p>';
  } else {
    var tabContent;
    if (ui.specTab === 'gross-profit'){
      tabContent = renderGrossProfitTabContent(activeCategory, activeVariant);
    } else if (ui.specTab === 'competitor'){
      tabContent = renderCompetitorTabContent(activeCategory, activeVariant);

      tabContent = '<dl class="spec-detail-grid">' +
        '<div><dt>担当者</dt><dd>'+escapeHtml(getMemberName(activeVariant.assigneeId))+'</dd></div>' +
        '<div><dt>販路</dt><dd>'+(activeVariant.salesChannel?escapeHtml(SALES_CHANNEL_LABELS[activeVariant.salesChannel]||activeVariant.salesChannel):'<span class="muted-text">未設定</span>')+'</dd></div>' +
        '<div><dt>対象店舗・対象自治体</dt><dd>'+(activeVariant.targetStores?escapeHtml(activeVariant.targetStores):'<span class="muted-text">未設定</span>')+'</dd></div>' +
        '<div><dt>仕入先</dt><dd>'+(activeVariant.supplier?escapeHtml(activeVariant.supplier):'<span class="muted-text">未設定</span>')+'</dd></div>' +
        '<div><dt>出荷場</dt><dd>'+(activeVariant.shippingLocation?escapeHtml(activeVariant.shippingLocation):'<span class="muted-text">未設定</span>')+'</dd></div>' +
        '<div><dt>想定売上高</dt><dd>'+formatManYen(activeVariant.estimatedRevenue)+'</dd></div>' +
        '<div><dt>参入市場</dt><dd>'+(activeVariant.entryMarketCount!==undefined&&activeVariant.entryMarketCount!==null&&activeVariant.entryMarketCount!==''?escapeHtml(String(activeVariant.entryMarketCount)):'<span class="muted-text">未設定</span>')+'</dd></div>' +
      '</dl>';
    }
    var actionsHtml = ui.specTab === 'detail' ?
      '<div class="spec-detail-actions">' +
        '<button type="button" class="btn btn-secondary" data-action="open-variant-edit" data-category-id="'+activeCategory.id+'" data-variant-id="'+activeVariant.id+'">編集</button>' +
        '<button type="button" class="btn btn-danger" data-action="delete-variant" data-category-id="'+activeCategory.id+'" data-variant-id="'+activeVariant.id+'">'+ICONS.trash+'削除</button>' +
      '</div>' : '';
    col3Body = '<div class="spec-detail">' +
      '<div class="spec-detail-header"><h3>'+escapeHtml(activeVariant.name)+'</h3>' + renderBadge(activeVariant.releaseStatus||'検討中', VARIANT_RELEASE_STATUS_COLORS[activeVariant.releaseStatus]||VARIANT_RELEASE_STATUS_COLORS['検討中']) + '</div>' +
      tabContent +
      actionsHtml +
    '</div>';
  }

  return '<div class="card section-gap"><p class="card-title">'+PRODUCT_DEV_AXIS_LABELS[activeAxis]+' — ジャンル / 商品名 / 規格詳細</p>' +
    '<div class="drilldown-grid">' +
      '<div class="drilldown-col"><div class="drilldown-col-header"><p class="drilldown-col-title">ジャンル</p><button type="button" class="link-btn" style="padding-bottom:0;" data-action="open-genre-modal">管理</button></div>'+col1Html+'</div>' +
      '<div class="drilldown-col"><div class="drilldown-col-header"><p class="drilldown-col-title">商品名</p>'+col2AddBtn+'</div>'+col2Html+'</div>' +
      '<div class="drilldown-col drilldown-col-detail"><p class="drilldown-col-title">規格詳細</p>'+variantChipsHtml+'<div class="spec-tabs">'+tabsHtml+'</div>'+col3Body+'</div>' +
    '</div>' +
  '</div>';
}
function renderGrossProfitTabContent(category, variant){
  var gp = variant.grossProfitTable;
  var editBtn = '<button type="button" class="btn btn-secondary gp-edit-btn" data-action="open-grossprofit-edit" data-category-id="'+category.id+'" data-variant-id="'+variant.id+'">'+(gp?'粗利表を編集':'粗利表を作成')+'</button>';
  if (!gp){
    return '<p class="empty-note">まだ粗利表が作成されていません。</p>' + editBtn;
  }
  var calc = calcGrossProfitTable(gp);
  var priceInfoHtml = '<dl class="spec-detail-grid">' +
    '<div><dt>販売価格</dt><dd>'+formatYen(gp.sellPrice)+(gp.orderQty&&Number(gp.orderQty)!==1?' × '+escapeHtml(String(gp.orderQty))+'件':'')+'</dd></div>' +
    (gp.listPrice!==undefined && gp.listPrice!=='' && gp.listPrice!==null ?
      '<div><dt>上代</dt><dd>'+formatYen(gp.listPrice)+'</dd></div>' +

    var amount = (Number(item.unitPrice)||0) * (Number(item.qty)||0);
    return '<tr><td>'+escapeHtml(item.label||'(未入力)')+'</td><td>'+formatYen(item.unitPrice)+'</td><td>'+escapeHtml(String(item.qty!==undefined&&item.qty!==''?item.qty:0))+'</td><td>'+formatYen(amount)+'</td></tr>';
  }).join('');
  var feeRow = '<tr><td>手数料('+escapeHtml(String(gp.feeRate!==undefined?gp.feeRate:0))+'%)</td><td colspan="2" class="muted-text">売上×手数料率</td><td>'+formatYen(calc.feeAmount)+'</td></tr>';
  var costItemsHtml = '<div class="table-wrap"><table class="gp-cost-table"><thead><tr><th>項目</th><th>単価</th><th>数量</th><th>金額</th></tr></thead><tbody>' +
    costRowsHtml + feeRow +

  var summaryHtml = '<div class="overview-grid" style="margin-top:12px;">' +
    '<div class="stat-box"><p class="stat-box-label">売上</p><p class="stat-box-value" style="font-size:16px;">'+formatYen(calc.revenue)+'</p></div>' +
    '<div class="stat-box"><p class="stat-box-label">商品原価</p><p class="stat-box-value" style="font-size:16px;">'+formatYen(calc.costTotal)+'</p></div>' +
    '<div class="stat-box"><p class="stat-box-label">粗利</p><p class="stat-box-value" style="font-size:16px;">'+formatYen(calc.grossProfit)+'</p></div>' +
    '<div class="stat-box"><p class="stat-box-label">粗利率</p><p class="stat-box-value" style="font-size:16px;">'+formatPercent1(calc.grossProfitRate)+'</p></div>' +
  '</div>';
  return priceInfoHtml + '<p class="card-title" style="margin-top:12px;">原価内訳</p>' + costItemsHtml + summaryHtml +
    (variant.salesTarget ? '<p class="muted-text" style="margin-top:10px;">売上目標: '+escapeHtml(variant.salesTarget)+'</p>' : '') +
    '<div style="margin-top:12px;">'+editBtn+'</div>';

/* ============================== タスク管理 ============================== */
function getFilteredTasks(){
  return appData.tasks.filter(function(t){
    if (t.workstream !== ui.activeWorkstream) return false;
    if (ui.taskFilters.assigneeId && t.assigneeId !== ui.taskFilters.assigneeId) return false;
    if (ui.taskFilters.status && t.status !== ui.taskFilters.status) return false;
    if (ui.taskFilters.dueBefore && (!t.dueDate || t.dueDate > ui.taskFilters.dueBefore)) return false;
    return true;
  });
}
function renderTasksPage(){
  var filters = ui.taskFilters;
  var hasActiveFilter = filters.assigneeId || filters.status || filters.dueBefore;
  var filterBar = '<div class="filter-bar">' +
    '<div class="filter-field"><label class="filter-label">担当者</label><select class="input" data-action="filter-change" data-filter="assigneeId">' + optionsHtml(appData.members.map(function(m){return {value:m.id,label:m.name};}), filters.assigneeId, 'すべて') + '</select></div>' +
    '<div class="filter-field"><label class="filter-label">ステータス</label><select class="input" data-action="filter-change" data-filter="status">' + optionsHtml(TASK_STATUS_ORDER.map(function(s){return {value:s,label:TASK_STATUS_LABELS[s]};}), filters.status, 'すべて') + '</select></div>' +
    '<div class="filter-field"><label class="filter-label">期限(この日まで)</label><input type="date" class="input" data-action="filter-change" data-filter="dueBefore" value="'+escapeHtml(filters.dueBefore)+'"></div>' +
    (hasActiveFilter ? '<button type="button" class="link-btn" data-action="clear-filters">フィルタをクリア</button>' : '') +
  '</div>';

  var filtered = getFilteredTasks();
  var body = ui.taskViewMode === 'kanban' ? renderKanbanBoard(filtered) : renderTaskListTable(filtered);

  return '<div class="page-header-row">'+renderPageHeaderTitle(ICONS.tasks, 'violet', WORKSTREAM_LABELS[ui.activeWorkstream]+' — タスク管理', 'かんばんとリスト表示を切り替えて進捗を管理できます。')+
    '<div style="display:flex;align-items:center;gap:8px;">' +
      '<div class="toggle-group">' +
        '<button type="button" class="toggle-btn '+(ui.taskViewMode==='kanban'?'active':'')+'" data-action="task-view-mode" data-mode="kanban">かんばん</button>' +
        '<button type="button" class="toggle-btn '+(ui.taskViewMode==='list'?'active':'')+'" data-action="task-view-mode" data-mode="list">リスト</button>' +
      '</div>' +
      '<button type="button" class="btn btn-primary" data-action="open-task-create">'+ICONS.plus+'タスクを追加</button>' +
    '</div></div>' +
    filterBar + body;
}
function renderKanbanBoard(tasks){
  var columns = TASK_STATUS_ORDER.map(function(status){
    var columnTasks = tasks.filter(function(t){return t.status===status;});
    var color = TASK_STATUS_COLORS[status];
    var cardsHtml = columnTasks.map(function(t){ return renderKanbanCard(t); }).join('');
    if (columnTasks.length===0) cardsHtml = '<p class="empty-note" style="padding:16px 0;">タスクなし</p>';
    return '<div class="kanban-column" data-status="'+status+'">' +
      '<div class="kanban-column-header"><div class="kanban-column-title"><span class="dot" style="background:'+color.dot+'"></span>'+TASK_STATUS_LABELS[status]+'</div><span class="kanban-count">'+columnTasks.length+'</span></div>' +
      cardsHtml +
    '</div>';
  }).join('');
  return '<div class="kanban-board">' + columns + '</div>';
}
function renderKanbanCard(t){
  var overdue = t.status!=='done' && isOverdue(t.dueDate);
  var axisHtml = t.productDevAxis ? '<span class="muted-text">'+escapeHtml(PRODUCT_DEV_AXIS_LABELS[t.productDevAxis])+'</span>' : '';
  return '<div class="kanban-card" draggable="true" data-task-id="'+t.id+'" data-action="open-task-edit">' +
    '<div class="kanban-card-tags">'+renderBadge(WORKSTREAM_LABELS[t.workstream], WORKSTREAM_COLORS[t.workstream])+axisHtml+'</div>' +
    '<p class="kanban-card-title">'+escapeHtml(t.title)+'</p>' +
    (t.description ? '<p class="kanban-card-desc">'+escapeHtml(t.description)+'</p>' : '') +
    '<div class="kanban-card-footer">'+renderBadge(TASK_PRIORITY_LABELS[t.priority], TASK_PRIORITY_COLORS[t.priority])+'<span class="muted-text">'+escapeHtml(getMemberName(t.assigneeId))+'</span></div>' +
    (t.dueDate ? '<p class="kanban-card-due '+(overdue?'overdue':'')+'">期限: '+formatDateJP(t.dueDate)+'</p>' : '') +
  '</div>';
}
function renderTaskListTable(tasks){
  var rows = tasks.map(function(t){
    var overdue = t.status!=='done' && isOverdue(t.dueDate);
    return '<tr data-action="open-task-edit" data-task-id="'+t.id+'">' +
      '<td class="cell-strong">'+escapeHtml(t.title)+'</td>' +
      '<td>'+renderBadge(WORKSTREAM_LABELS[t.workstream], WORKSTREAM_COLORS[t.workstream])+'</td>' +
      '<td>'+escapeHtml(getMemberName(t.assigneeId))+'</td>' +
      '<td>'+renderBadge(TASK_STATUS_LABELS[t.status], TASK_STATUS_COLORS[t.status])+'</td>' +
      '<td>'+renderBadge(TASK_PRIORITY_LABELS[t.priority], TASK_PRIORITY_COLORS[t.priority])+'</td>' +
      '<td style="'+(overdue?'color:'+COLORS.red600+';font-weight:600;':'')+'">'+formatDateJP(t.dueDate)+'</td>' +
    '</tr>';
  }).join('');
  if (tasks.length===0) rows = '<tr><td colspan="6" class="empty-note">該当するタスクがありません。</td></tr>';
  return '<div class="table-wrap"><table><thead><tr><th>タイトル</th><th>ワークストリーム</th><th>担当者</th><th>ステータス</th><th>優先度</th><th>期限</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ============================== 商品カテゴリー評価 ============================== */
function renderCategoriesPage(){
  var categories = appData.productCategories;
  var evaluations = {};
  categories.forEach(function(c){
    evaluations[c.id] = evaluateMarketEntry({genre:c.genre, marketSizeCategory:c.marketSizeCategory, topSharePercent:c.topSharePercent, topCompanyCount:c.topCompanyCount, hasProcessingConstraint:c.hasProcessingConstraint});
  });
  var sorted = categories.slice();
  if (ui.categorySortMode === 'recommendation'){
    sorted.sort(function(a,b){
      var wd = RECOMMENDATION_SORT_WEIGHT[evaluations[b.id].recommendation] - RECOMMENDATION_SORT_WEIGHT[evaluations[a.id].recommendation];
      if (wd !== 0) return wd;
      var as = evaluations[a.id].totalScore === null ? -Infinity : evaluations[a.id].totalScore;
      var bs = evaluations[b.id].totalScore === null ? -Infinity : evaluations[b.id].totalScore;
      return bs - as;
    });
  } else {
    sorted.sort(function(a,b){ return a.createdAt < b.createdAt ? -1 : 1; });
  }

  var rows = sorted.map(function(c){
    var ev = evaluations[c.id];
    return '<tr data-action="open-category-edit" data-category-id="'+c.id+'">' +
      '<td class="cell-strong">'+escapeHtml(c.name)+'</td>' +
      '<td>'+escapeHtml(c.genre)+'</td>' +
      '<td>'+escapeHtml(c.marketSizeCategory || '未設定')+'</td>' +

      table +

}
function renderBubbleChart(categories, evaluations){
  var plottable = categories.filter(function(c){ return c.topSharePercent!==undefined && c.marketSizeOku!==undefined && c.marketSizeCategory!==undefined; });
  var inner;
  if (plottable.length === 0){
    inner = '<p class="empty-note">トップシェア%・市場規模(億円・区分)を入力した候補が登録されると、ここにバブルチャートが表示されます。</p>';
  } else {
    var width = 640, height = 340, padL = 55, padR = 20, padT = 20, padB = 44;
    var maxShare = Math.max.apply(null, plottable.map(function(c){return c.topSharePercent;}).concat([10])) + 5;
    var maxSize = Math.max.apply(null, plottable.map(function(c){return c.marketSizeOku;}).concat([100])) * 1.15;
    var maxCompanies = Math.max.apply(null, plottable.map(function(c){return c.topCompanyCount||1;}).concat([1]));
    function xScale(v){ return padL + (v/maxShare) * (width-padL-padR); }
    function yScale(v){ return height - padB - (v/maxSize) * (height-padT-padB); }
    function rScale(v){ return 6 + (v/maxCompanies) * 16; }

    var xTicks = [];
    for (var i=0;i<=4;i++){ var xv = Math.round(maxShare/4*i); xTicks.push(xv); }
    var yTicks = [];
    for (var j=0;j<=4;j++){ var yv = Math.round(maxSize/4*j); yTicks.push(yv); }

    var gridHtml = xTicks.map(function(xv){
      return '<line x1="'+xScale(xv)+'" y1="'+padT+'" x2="'+xScale(xv)+'" y2="'+(height-padB)+'" stroke="#e2e8f0" stroke-width="1"/>' +
        '<text x="'+xScale(xv)+'" y="'+(height-padB+16)+'" font-size="10" fill="#64748b" text-anchor="middle">'+xv+'%</text>';
    }).join('') + yTicks.map(function(yv){
      return '<line x1="'+padL+'" y1="'+yScale(yv)+'" x2="'+(width-padR)+'" y2="'+yScale(yv)+'" stroke="#e2e8f0" stroke-width="1"/>' +
        '<text x="'+(padL-8)+'" y="'+(yScale(yv)+3)+'" font-size="10" fill="#64748b" text-anchor="end">'+yv+'</text>';
    }).join('');

    var pointsHtml = plottable.map(function(c){
      var ev = evaluations[c.id];
      var color = RECOMMENDATION_HEX[ev.recommendation];
      var tooltip = escapeHtml(c.name) + ': シェア' + c.topSharePercent + '% / 市場規模' + c.marketSizeOku + '億円 / 上位' + (c.topCompanyCount||'-') + '社 / 推奨度' + ev.recommendation;
      return '<circle cx="'+xScale(c.topSharePercent)+'" cy="'+yScale(c.marketSizeOku)+'" r="'+rScale(c.topCompanyCount||1)+'" fill="'+color+'" fill-opacity="0.7" stroke="'+color+'" stroke-width="1.5"><title>'+tooltip+'</title></circle>';
    }).join('');

    var axisLabels = '<text x="'+(width/2)+'" y="'+(height-6)+'" font-size="11" fill="#475569" text-anchor="middle">トップシェア(%)</text>' +
      '<text x="14" y="'+(height/2)+'" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 14 '+(height/2)+')">市場規模(億円)</text>';

    inner = '<div class="bubble-chart-wrap"><svg viewBox="0 0 '+width+' '+height+'" style="width:100%;height:auto;max-width:'+width+'px;">' +
      gridHtml + pointsHtml + axisLabels +
    '</svg></div>' +
    '<div class="bubble-legend">' + RECOMMENDATION_CHART_ORDER.map(function(level){
      return '<span class="bubble-legend-item"><span class="bubble-legend-dot" style="background:'+RECOMMENDATION_HEX[level]+'"></span>'+level+'</span>';
    }).join('') + '</div>';
  }
  return '<div class="card"><p class="card-title">市場規模 × トップシェア バブルチャート</p><p class="card-subtitle">横軸:トップシェア% / 縦軸:市場規模(億円) / バブルの大きさ:上位社数</p>'+inner+'</div>';
}

function countAllVariants(){
  var count = 0;
  appData.productCategories.forEach(function(c){ count += (c.variants||[]).length; });
  return count;
}
function countReleasedVariants(){
  var count = 0;
  appData.productCategories.forEach(function(c){
    (c.variants||[]).forEach(function(v){ if (v.releaseStatus==='リリース完了') count++; });
  });
  return count;
}
function sumReleasedEstimatedRevenue(){
  var sum = 0;
  appData.productCategories.forEach(function(c){
    (c.variants||[]).forEach(function(v){
      if (v.releaseStatus==='リリース完了'){
        sum += toNumberOrUndefined(v.estimatedRevenue) || 0;
      }
    });
  });
  return sum;
}

function handleMeetingFormSubmit(form){
  var date = form.querySelector('#meeting-date').value;
  var title = form.querySelector('#meeting-title').value.trim();
  if (!date || !title) return;
  var participants = form.querySelector('#meeting-participants').value.split(/[,、]/).map(function(s){return s.trim();}).filter(Boolean);
  var decisions = form.querySelector('#meeting-decisions').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var nextActions = [];
  form.querySelectorAll('.next-action-row').forEach(function(row){
    var text = row.querySelector('.na-text').value.trim();
    if (!text) return;
    nextActions.push({
      id: row.dataset.naId || createId('next-action'),
      text: text,
      done: row.dataset.naDone === 'true',
      linkedTaskId: row.dataset.naLinked || undefined
    });
  });
  var input = {date:date, title:title, participants:participants, decisions:decisions, nextActions:nextActions};
  var m = ui.meetingModal;
  if (m.mode === 'create') addMeeting(input); else updateMeeting(m.id, input);
  ui.meetingModal = null;
  render();
}

  else if (action === 'open-task-edit'){ openTaskEdit(el.dataset.taskId); }
  else if (action === 'delete-task'){ deleteTask(el.dataset.taskId); ui.taskModal = null; render(); }

  else if (action === 'open-meeting-edit'){ openMeetingEdit(el.dataset.meetingId); }
  else if (action === 'delete-meeting'){ deleteMeeting(el.dataset.meetingId); ui.meetingModal = null; render(); }
  else if (action === 'select-product-axis'){ ui.activeProductAxis = el.dataset.axis; ui.drilldownGenre = null; ui.drilldownCategoryId = null; ui.drilldownVariantId = null; ui.specTab = 'summary'; render(); }
  else if (action === 'select-drilldown-genre'){ ui.drilldownGenre = el.dataset.genre; ui.drilldownCategoryId = null; ui.drilldownVariantId = null; render(); }
  else if (action === 'select-drilldown-category'){ ui.drilldownCategoryId = el.dataset.categoryId; ui.drilldownVariantId = null; render(); }
  else if (action === 'select-drilldown-variant'){ ui.drilldownVariantId = el.dataset.variantId; render(); }

  else if (action === 'open-variant-edit'){ openVariantEdit(el.dataset.categoryId, el.dataset.variantId); }
  else if (action === 'delete-variant'){ deleteVariant(el.dataset.categoryId, el.dataset.variantId); ui.variantModal = null; ui.drilldownVariantId = null; render(); }
  else if (action === 'open-member-create'){ openMemberCreate(); }
  else if (action === 'open-member-edit'){ openMemberEdit(el.dataset.memberId); }
  else if (action === 'delete-member'){ deleteMember(el.dataset.memberId); ui.memberModal = null; render(); }
  else if (action === 'open-goal-create'){ openGoalCreate(); }
  else if (action === 'delete-goal'){ deleteGoal(el.dataset.goalId); render(); }

    render();

    var row = el.closest('.cost-item-row');
    if (row) row.remove();
    onGrossProfitFieldChange();
  }
  else if (action === 'open-competitor-create'){ openCompetitorCreate(el.dataset.categoryId); }
  else if (action === 'open-competitor-edit'){ openCompetitorEdit(el.dataset.categoryId, el.dataset.competitorId); }
  else if (action === 'delete-competitor'){ deleteCompetitor(el.dataset.categoryId, el.dataset.competitorId); ui.competitorModal = null; render(); }

    var meeting = appData.meetings.filter(function(x){return x.id===el.dataset.meetingId;})[0];
    var na = meeting ? meeting.nextActions.filter(function(n){return n.id===el.dataset.nextActionId;})[0] : null;
    if (na) openTaskCreate(na.text, ui.activeWorkstream, {meetingId:el.dataset.meetingId, nextActionId:el.dataset.nextActionId});
  }
  else if (action === 'close-modal'){
    /* オーバーレイ自体(背景)がマッチした場合は、実際にクリックされたのが
       背景そのものの時だけ閉じる(モーダル内部の余白クリックで誤って
       閉じないようにするため)。X/キャンセルボタンは直接マッチするので無条件で閉じる。 */
    if (el.classList.contains('modal-overlay') && e.target !== el) return;
    var which = el.dataset.modal;
    if (which === 'task') closeTaskModal();
    else if (which === 'category') closeCategoryModal();
    else if (which === 'meeting') closeMeetingModal();
    else if (which === 'variant') closeVariantModal();
    else if (which === 'member') closeMemberModal();
    else if (which === 'grossprofit') closeGrossProfitModal();
    else if (which === 'competitor') closeCompetitorModal();
    else if (which === 'genre') closeGenreModal();
    else if (which === 'goal') closeGoalModal();
    else if (which === 'oku25item') closeOku25ItemModal();
    else if (which === 'oku25genre') closeOku25GenreModal();
    else if (which === 'oku25log') closeOku25LogModal();
    else if (which === 'relateddoc') closeRelatedDocModal();
  }
  else if (action === 'export-json'){
    downloadDataAsJson();
    ui.dataMessage = {type:'success', text:'JSONファイルを書き出しました。'};
    render();
  }
  else if (action === 'import-json-trigger'){
    document.getElementById('import-file-input').click();
  }
  else if (action === 'remove-next-action-row'){
    var row = el.closest('.next-action-row');
    if (row) row.remove();
  }
});

  e.target.value = '';
  if (!file) return;
  var confirmed = window.confirm('現在のデータがすべて、選択したファイルの内容で上書きされます。\n\nこの変更はSharePoint経由でチーム全員に反映され、元に戻すことはできません。\n\n実行してよろしいですか?');
  if (!confirmed) return;
  readDataFromJsonFile(file).then(function(data){
    appData.members = data.members; appData.tasks = data.tasks;
    appData.productCategories = data.productCategories; appData.meetings = data.meetings;
    appData.genres = data.genres || PRODUCT_GENRE_ORDER.slice();
    appData.goals = data.goals || [];
    appData.oku25Items = data.oku25Items || [];
    appData.oku25Genres = data.oku25Genres || PRODUCT_GENRE_ORDER.slice();
    appData.oku25GenreTargets = data.oku25GenreTargets || {};
    appData.relatedDocs = data.relatedDocs || {};
    appData.aiSearchFlowUrl = data.aiSearchFlowUrl || "";
    saveData();
    ui.dataMessage = {type:'success', text:'「'+file.name+'」を読み込み、データを置き換えました。'};
    render();
  }).catch(function(err){
    ui.dataMessage = {type:'error', text: err.message || '読み込みに失敗しました。'};
    render();
  });
});

/* ============================== かんばん: ネイティブドラッグ&ドロップ ============================== */
document.addEventListener('dragstart', function(e){
  var card = e.target.closest('.kanban-card');
  if (card){
    draggedTaskId = card.dataset.taskId;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.taskId);
  }
});
document.addEventListener('dragend', function(e){
  var card = e.target.closest('.kanban-card');
  if (card) card.classList.remove('dragging');
  document.querySelectorAll('.kanban-column.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
  draggedTaskId = null;
});
document.addEventListener('dragover', function(e){
  var column = e.target.closest('.kanban-column');
  if (column){ e.preventDefault(); column.classList.add('drag-over'); }
});
document.addEventListener('dragleave', function(e){
  var column = e.target.closest('.kanban-column');
  if (column && !column.contains(e.relatedTarget)) column.classList.remove('drag-over');
});
document.addEventListener('drop', function(e){
  var column = e.target.closest('.kanban-column');
  if (column){
    e.preventDefault();
    var taskId = draggedTaskId || e.dataTransfer.getData('text/plain');
    if (taskId) updateTask(taskId, {status: column.dataset.status});
  }
  document.querySelectorAll('.kanban-column.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
  draggedTaskId = null;
  render();
});

/* ============================== 起動 ============================== */
render();
initSharePointSync();
</script>
</body>
</html>
